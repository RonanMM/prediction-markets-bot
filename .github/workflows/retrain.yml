# Manual model retrain — laptop-independent, on-demand only.
#
# Mirrors scripts/raincheck_validate.sh: fetch resolution-faithful station truth + per-lead
# archived forecasts (single- and multi-model), retrain the per-lead EMOS v2 calibrators,
# regenerate BOTH eval trackers (calibrated + pure-ensemble baseline), then run the arbiter
# (evaluate_oos.py) and the sample-gate tracker (data_status.py).
#
# workflow_dispatch ONLY (no schedule): model artifacts drive the paper bets and CLAUDE.md flags
# a pending settlement-truth retrain (W0.2), so new models should be reviewed via the run log /
# resulting commit before they take effect. To make it automatic later, add a `schedule:` block.
#
# Commits refreshed models/*.json + the regenerated output/ trackers. --no_plots skips the
# gitignored 200 MB plot set.

name: retrain

on:
  # WEEKLY (added 2026-07-28). Counter-intuitively this is CHEAPER than running it monthly:
  # the per-fetch archive cache below is evicted after 7 days without access, so a monthly
  # schedule would run COLD every single time (full 2022→now refetch, ~3-4h, heavy on
  # Open-Meteo's free archive) while a weekly one keeps the cache warm and each run pulls
  # only the new week (minutes). Sunday 04:20 UTC — quiet slot, and a whole day before the
  # week's first collector-heavy period.
  #
  # What this does and does NOT do:
  #   - DOES keep the served models current as the archives grow (the pending win is
  #     daily_mm accumulating enough complete rows for the multi-model blend to serve more
  #     than ~16% of them).
  #   - Does NOT "track how the model is doing" — that is truth-eval.yml, daily. Retrain
  #     regenerates the trackers as a side effect, which makes it LOOK like the measurement
  #     tool, but using a multi-hour job to refresh a 5-minute daily measurement is the wrong
  #     instrument.
  #
  # ⚠️ Model artifacts change under the E3 per-bucket FORWARD gates, so a gate's forward
  # sample can now span more than one model version. Acceptable while everything is paper;
  # revisit before any bucket goes live (see config.LIVE_BUCKETS / E3_NOMINATION_DATE).
  schedule:
    # TWICE weekly (Sun + Wed), and the second run is not about fresher models — it is what keeps
    # the archive cache ALIVE. GitHub evicts a cache after 7 days without access; a weekly cron is
    # exactly 7 days apart, so it sits ON the eviction boundary. This repo's own measurements show
    # schedules firing 1-3h late with slots dropped outright, so any lateness tips a run past it.
    #
    # That failure is SELF-PERPETUATING, and it already happened: the 2026-08-02 run came 8 days
    # after 2026-07-25, found a cold cache, ran the full 2022->now refetch, consumed all 360
    # minutes (the hosted-runner hard cap — it cannot simply be raised) and was killed at the Tmin
    # archive step. A killed run banks less cache, so the next run is colder still. The model sat
    # frozen at the 2026-07-25 build for 11 days and nothing reported it, because a job that
    # produces no commit looks identical whether it ran and changed nothing or died.
    #
    # Two runs 3-4 days apart stay comfortably inside the window even when late. A warm run is
    # only an incremental pull, so the extra one is cheap.
    - cron: "20 4 * * 0"
    - cron: "20 4 * * 3"
  workflow_dispatch: {}

concurrency:
  group: git-push          # shared with truth-eval: both rewrite the same tracker CSVs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    # 360 (the hosted-runner hard cap) for the COLD-cache runs: refetching every leads archive
    # (best_match + mm + cand incl. jma) 2022→now is ~3-4h, worse on a slow-API day — the 240
    # cap killed the 2026-07-21 run mid-cand. With the per-fetch cache banking below, even a
    # capped run makes forward progress, so this converges in ≤2 runs. Drop back to ~60 once the
    # cache is warm and incremental fetches take minutes.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/polymarket_weather/requirements.txt

      - name: Install dependencies
        run: pip install -r src/polymarket_weather/requirements.txt

      - name: Station truth (NWS CLI / IEM METAR / HKO)
        working-directory: src/polymarket_weather
        run: python fetch_historical_truth.py

      # wu_truth.py input — see truth-eval.yml. Prerequisite for the rebuild below, which
      # blends the WU reconstruction into the training targets.
      - name: Hourly station observations (wu_truth input)
        working-directory: src/polymarket_weather
        run: python fetch_station_obs.py

      # W0.2 training targets. train_calibrator.py reads {slug}_settlement_actuals.csv via
      # settlement_truth.load_training_truth, and that file is COMMITTED but rebuilt by no
      # workflow — so it freezes at whenever someone last ran this by hand, and the merge
      # against it silently drops every newer date from training. Rebuild in-runner (from the
      # truth + obs fetched above) so training always covers through yesterday. Not committed:
      # this workflow only adds models/ and output/, and the in-runner copy is what trains.
      - name: Rebuild settlement-faithful training targets
        working-directory: src/polymarket_weather
        run: python settlement_truth.py

      # Cache the previous-runs leads archives across runs. Gitignored and refetched 2022→now
      # every cold run (~3-4h on a slow-API day). Paired with the incremental fetch in
      # fetch_historical_leads[_mm/_cand].py, a restored cache means each run only pulls the
      # last ~3 weeks plus new dates: minutes, not hours.
      #
      # RESTORE + PER-FETCH SAVE (not a single actions/cache): a single cache only saves in a
      # POST step, which GitHub SKIPS on a hard timeout — so the 2026-07-21 4h-capped run banked
      # NOTHING and a retry would start cold again (groundhog). Instead: restore once, then save
      # INLINE right after each fetch, so each fetch's result is banked immediately and survives
      # a later timeout. Keys are unique+incrementing per run; restore-keys grabs the newest
      # (=most complete) prior cache. Convergence: a run capped mid-cand still banks leads+mm, so
      # the next run restores those (fast) and only fetches cand → finishes well inside the cap.
      - name: Restore per-lead forecast archives
        uses: actions/cache/restore@v4
        with:
          path: |
            src/polymarket_weather/data/weather/*_historical_leads*.csv
          key: leads-archive-${{ github.run_id }}
          restore-keys: |
            leads-archive-

      - name: Per-lead archived forecasts (Open-Meteo Previous Runs)
        working-directory: src/polymarket_weather
        run: python fetch_historical_leads.py

      - name: Bank cache (after best_match leads)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            src/polymarket_weather/data/weather/*_historical_leads*.csv
          key: leads-archive-${{ github.run_id }}-1-leads

      - name: Multi-model per-lead archives
        working-directory: src/polymarket_weather
        run: python fetch_historical_leads_mm.py

      - name: Bank cache (after multi-model)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            src/polymarket_weather/data/weather/*_historical_leads*.csv
          key: leads-archive-${{ github.run_id }}-2-mm

      # Candidate blend models (gem/aifs/mf/cma/bom). REQUIRED for the calibrated blend:
      # train_calibrator only builds mm_mean when the FULL per-city model set is present
      # (MM_MODELS_BY_CITY), and every set needs at least `gem` from here — so without this
      # step mm_mean is never built and training silently falls back to best_match for ALL
      # cities, leaving the expensive mm fetch above inert. Unlocks the Tmax blend for all
      # five cities: cand now also fetches `jma_seamless` (Seoul's blend needs it, and nothing
      # else produced the jma archive). Serving may still fall back for some cities until the
      # daily_mm/ensemble serve-time schema issue is resolved (see CLAUDE.md caveat). Tmin is
      # now wired below.
      - name: Candidate blend models (gem/aifs/mf…)
        working-directory: src/polymarket_weather
        run: python fetch_historical_leads_cand.py

      - name: Bank cache (after candidate blend)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            src/polymarket_weather/data/weather/*_historical_leads*.csv
          key: leads-archive-${{ github.run_id }}-3-cand

      # Tmin training archives. ~26% of markets settle on the daily MINIMUM and are priced by
      # a dedicated Tmin stack ({slug}_emos_min.json, same per-city blend). Without this fetch
      # the min archives aren't present on a fresh runner, so train_calibrator can't rebuild
      # the min models and they FREEZE at whatever was last committed by hand — they had stuck
      # at 2026-07-04 while the Tmax models retrained daily-fresh, silently mispricing a quarter
      # of the book. fetch_historical_leads_min writes both files train_calibrator needs
      # (best_match {slug}_historical_leads_min.csv + blend {slug}_historical_leads_min_mm.csv)
      # and is now incremental like the Tmax fetchers, so a warm cache means it only pulls the
      # recent tail. The *_historical_leads* cache glob above already covers the _min files.
      - name: Per-lead MIN archives (Tmin training data)
        working-directory: src/polymarket_weather
        run: python fetch_historical_leads_min.py

      - name: Bank cache (after Tmin)
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: |
            src/polymarket_weather/data/weather/*_historical_leads*.csv
          key: leads-archive-${{ github.run_id }}-4-min

      - name: Train per-lead EMOS v2 calibrators
        working-directory: src/polymarket_weather
        run: python train_calibrator.py

      # QRF forecaster (docs/superpowers/specs/2026-07-24-qrf-forecaster-design.md). Trains a
      # per-city Quantile-Regression-Forest on the SAME archives train_calibrator just used
      # (leads_mm + cand + jma, joined to settlement truth) and self-gates each city vs the
      # ensemble on a temporal holdout. Writes models/{slug}_qrf.joblib + {slug}_qrf_meta.json
      # (the beats_ensemble switch the served QRFPredictor reads); both are staged by the wide
      # `git add src/polymarket_weather/models` in the commit step below.
      - name: Train QRF forecaster
        working-directory: src/polymarket_weather
        # First-run fault isolation: QRF is a NEW, self-gated forecaster (inert until it beats
        # the ensemble on holdout). A crash here must never torpedo the valuable EMOS/W0.2
        # retrain + trackers + commit that follow — QRF just stays untrained (its designed
        # fallback). Remove once train_qrf has a few clean live runs.
        continue-on-error: true
        run: python train_qrf.py

      - name: Regenerate eval tracker (calibrated model)
        working-directory: src/polymarket_weather
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots

      - name: Regenerate eval tracker (pure ensemble baseline)
        working-directory: src/polymarket_weather
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots --disable-calibrator

      # QRF eval tracker (opportunities_evaluation_qrf.csv) so evaluate_oos.py can print the
      # M1 GATE line (QRF vs ensemble Brier/CRPS). Mirrors the two regenerations above; QRF
      # self-gates per city, so an un-gated/not-yet-winning city simply contributes nothing.
      - name: Regenerate eval tracker (QRF)
        working-directory: src/polymarket_weather
        continue-on-error: true          # same first-run isolation as the QRF training step
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots --predictor qrf

      - name: Arbiter + gate
        working-directory: src/polymarket_weather
        run: |
          python evaluate_oos.py
          python data_status.py

      - name: Commit refreshed models + trackers
        run: |
          git config user.name "raincheck-collector"
          git config user.email "actions@users.noreply.github.com"
          # data/weather/*_settlement_actuals.csv are TRACKED, and the rebuild step above
          # rewrites them — so they MUST be staged. Leaving tracked files dirty makes the
          # `git pull --rebase` below abort ("cannot pull with rebase: You have unstaged
          # changes"), which is how the 2026-07-20 19:30 run threw away a completed 76-minute
          # retrain after collect.yml raced it. Committing them also keeps the checked-in
          # training truth fresh for every other load_training_truth consumer.
          git add src/polymarket_weather/models src/polymarket_weather/output \
                  src/polymarket_weather/data/weather/*_settlement_actuals.csv
          if git diff --cached --quiet; then
            echo "No model/tracker changes — nothing to commit."
            exit 0
          fi
          git commit -m "retrain: EMOS v2 models + regenerated trackers $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Conflict-proof push (see truth-eval.yml for the full write-up). A rejected push
          # means origin/master moved under us (collect snapshot, or a racing truth-eval).
          # A plain rebase content-conflicts on the regenerated eval CSVs and dies; here we
          # rebase with `-X theirs`, which KEEPS OUR regeneration — retrain's trackers are
          # computed from the freshly-trained models, so on a collision with truth-eval's
          # older-model regeneration, retrain must win. --autostash also protects the tracked
          # *_settlement_actuals.csv the rebuild step rewrote; || abort clears a stuck rebase.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing onto latest origin/master"
            git pull --rebase --autostash -X theirs || git rebase --abort
          done
          git push

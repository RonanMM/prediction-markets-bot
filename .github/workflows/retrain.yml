# Manual model retrain — laptop-independent, on-demand only.
#
# Mirrors scripts/raincheck_validate.sh: fetch resolution-faithful station truth + per-lead
# archived forecasts (single- and multi-model), retrain the per-lead EMOS v2 calibrators,
# regenerate BOTH eval trackers (calibrated + pure-ensemble baseline), then run the arbiter
# (evaluate_oos.py) and the sample-gate tracker (data_status.py).
#
# workflow_dispatch ONLY (no schedule): model artifacts drive the paper bets and CLAUDE.md flags
# a pending settlement-truth retrain (W0.2), so new models should be reviewed via the run log /
# resulting commit before they take effect. To make it automatic later, add a `schedule:` block.
#
# Commits refreshed models/*.json + the regenerated output/ trackers. --no_plots skips the
# gitignored 200 MB plot set.

name: retrain

on:
  workflow_dispatch: {}

concurrency:
  group: git-push          # shared with truth-eval: both rewrite the same tracker CSVs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/polymarket_weather/requirements.txt

      - name: Install dependencies
        run: pip install -r src/polymarket_weather/requirements.txt

      - name: Station truth (NWS CLI / IEM METAR / HKO)
        working-directory: src/polymarket_weather
        run: python fetch_historical_truth.py

      - name: Per-lead archived forecasts (Open-Meteo Previous Runs)
        working-directory: src/polymarket_weather
        run: python fetch_historical_leads.py

      - name: Multi-model per-lead archives
        working-directory: src/polymarket_weather
        run: python fetch_historical_leads_mm.py

      - name: Train per-lead EMOS v2 calibrators
        working-directory: src/polymarket_weather
        run: python train_calibrator.py

      - name: Regenerate eval tracker (calibrated model)
        working-directory: src/polymarket_weather
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots

      - name: Regenerate eval tracker (pure ensemble baseline)
        working-directory: src/polymarket_weather
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots --disable-calibrator

      - name: Arbiter + gate
        working-directory: src/polymarket_weather
        run: |
          python evaluate_oos.py
          python data_status.py

      - name: Commit refreshed models + trackers
        run: |
          git config user.name "raincheck-collector"
          git config user.email "actions@users.noreply.github.com"
          git add src/polymarket_weather/models src/polymarket_weather/output
          if git diff --cached --quiet; then
            echo "No model/tracker changes — nothing to commit."
            exit 0
          fi
          git commit -m "retrain: EMOS v2 models + regenerated trackers $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Rebase-retry push: tolerate racing commits from the collect workflow.
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && continue
          done
          git push

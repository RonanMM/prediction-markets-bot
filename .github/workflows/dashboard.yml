# Build the status dashboard and publish it to the public GitHub Pages repo — free, auto-updating.
#
# Only the rendered index.html (curated, no raw data) is pushed to a small PUBLIC repo that
# GitHub Pages serves. build_dashboard.py reads the live numbers from the committed eval tracker
# + the honest-eval scripts, so the page always matches the real state. (The main repo was made
# public 2026-07-25 for free Actions minutes; this split is kept for a clean, data-free page.)
#
# One-time setup (see the chat instructions):
#   1. Create a PUBLIC repo:  RonanMM/prediction-markets-bot-dashboard  (empty)
#   2. Create a fine-grained PAT with Contents: Read and write on THAT repo,
#      add it to THIS repo as an Actions secret named  DASHBOARD_TOKEN
#   3. After the first run pushes index.html, enable Pages on the public repo
#      (Settings -> Pages -> Deploy from a branch -> main / root)

name: dashboard

on:
  schedule:
    # Every 2h, targeting ~3h effective: GitHub delayed these runs ~2h45-3h05 and dropped slots
    # outright (measured 2026-07-27 — the 10:27 run was the 07:40 slot). A late rebuild is not
    # cosmetic: the page's freshness pill is computed from the payload, so a dropped slot used to
    # read as "collector stale" even while the collector was fine.
    - cron: "40 */2 * * *"
  workflow_dispatch: {}

concurrency:
  group: dashboard
  cancel-in-progress: true

permissions:
  contents: read

env:
  PAGES_REPO: RonanMM/prediction-markets-bot-dashboard

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # 30, not 20: the capture tier took fetch_historical_truth from 5 to 12 cities and
    # fetch_station_obs from 4 to 11 stations (~+5.5 min per run), and this job refreshes BOTH
    # before building. The dashboard needs none of the seven new cities, but the fetchers take
    # no --cities flag, so it pays the cost anyway. A timeout kill here is not a harmless retry:
    # the publish is skipped and the last-good page silently stays up, which looks exactly like
    # a healthy run in the run list.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/polymarket_weather/requirements.txt

      - name: Install dependencies
        run: pip install -r src/polymarket_weather/requirements.txt

      - name: Refresh station truth (best-effort — grades stay current)
        working-directory: src/polymarket_weather
        run: python fetch_historical_truth.py || echo "truth refresh skipped (network) — using committed tracker"

      # Without this the published dashboard grades NYC/Chicago on the NWS CLI feed rather
      # than the wunderground-faithful reconstruction (wu_truth.py), which flips ~3% of rows
      # — concentrated in NYC|same-day and Chicago|1d. Best-effort to match the step above:
      # a network blip should degrade the numbers, not block the publish.
      - name: Refresh hourly station observations (wu_truth input)
        working-directory: src/polymarket_weather
        run: python fetch_station_obs.py || echo "obs refresh skipped (network) — NYC/Chicago fall back to CLI truth"

      # Settlement audit BEFORE building. truth-eval has run this since W0; the dashboard never
      # did, and that asymmetry is why the 2026-07-30 incident reached the public page: LGA's
      # 2026 obs chunk failed, wu_truth silently fell back to the CLI ruler, and the published
      # pooled gap moved from +0.0178 (CI entirely above zero) to +0.0122 (CI spanning zero) —
      # the project's headline verdict, flipped by a dropped HTTP request, on a green run.
      # audit_settlements.py exits 1 below 95% agreement, so a degraded ruler now BLOCKS the
      # publish and the last good copy stays up. Failing loudly beats publishing a wrong number.
      - name: Settlement audit — refuse to publish on a degraded ruler
        working-directory: src/polymarket_weather
        run: python audit_settlements.py

      - name: Build dashboard
        working-directory: src/polymarket_weather
        run: python build_dashboard.py "${GITHUB_WORKSPACE}/site/index.html"

      - name: Publish to Pages repo
        env:
          DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
        run: |
          if [ -z "${DASHBOARD_TOKEN}" ]; then
            echo "::warning::DASHBOARD_TOKEN not set — build succeeded but nothing published. Add the secret to enable publishing."
            exit 0
          fi
          git clone --depth 1 "https://x-access-token:${DASHBOARD_TOKEN}@github.com/${PAGES_REPO}.git" pub
          cp site/index.html pub/index.html
          cp site/data.json  pub/data.json
          # The guide is a static, checked-in page (no build step, no JS, no external assets).
          # It ships alongside the dashboard so the footer link resolves for every visitor —
          # linking the private claude.ai artifact instead would 404 for everyone but the author.
          cp src/polymarket_weather/guide.html pub/guide.html
          touch pub/.nojekyll
          cd pub
          git config user.name "raincheck-collector"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data.json guide.html .nojekyll
          if git diff --cached --quiet; then
            echo "Dashboard unchanged — nothing to publish."
            exit 0
          fi
          git commit -m "dashboard: $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push

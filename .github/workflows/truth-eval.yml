# Daily truth refresh + eval-tracker regeneration — laptop-independent.
#
# Mirrors scripts/raincheck_truth_eval.sh (the launchd truth-eval agent), which had no cloud
# equivalent: the eval tracker only updated when run on the laptop. Order matters — refresh
# station truth first so newly-published obs make resolved markets gradable, THEN regenerate
# output/opportunities_evaluation_calibrated.csv from the grown snapshot history.
#
# Runs AFTER collection has had time to land (collect.yml runs every 2h). Exact time is not
# critical: settlement-faithful truth lags ~1 day (HKO ~1 month), so a market becomes gradable
# a day or so after it resolves regardless of when this fires.
#
# Refetchable truth files (*_historical_*, *_obs_hourly) are gitignored and re-fetched each run;
# only the tracked eval-tracker CSVs under output/ are committed. --no_plots skips regenerating
# the gitignored 200 MB plot set.

name: truth-eval

on:
  schedule:
    - cron: "0 9 * * *"    # daily ~09:00 UTC; offset well clear of collect's :13 cadence
  workflow_dispatch: {}

concurrency:
  group: git-push          # shared with the other committing workflows to serialise pushes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  truth-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/polymarket_weather/requirements.txt

      - name: Install dependencies
        run: pip install -r src/polymarket_weather/requirements.txt

      - name: Refresh station truth
        working-directory: src/polymarket_weather
        run: python fetch_historical_truth.py

      # Hourly METARs — REQUIRED, not optional. wu_truth.py reconstructs the settlement
      # extremes for NYC/Chicago from this file and returns None *silently* when it is
      # absent, so grading falls back to the NWS CLI feed — the pre-W0 ruler. The obs file
      # is gitignored and only ever written by main.py on the collect runner, so a fresh
      # runner has none unless we fetch it here. Full fetch, not --recent: a 3-day top-up
      # onto a nonexistent file leaves the same gap.
      - name: Refresh hourly station observations (wu_truth input)
        working-directory: src/polymarket_weather
        run: python fetch_station_obs.py

      - name: Regenerate eval tracker
        working-directory: src/polymarket_weather
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots

      # The headline MODEL-vs-ENSEMBLE verdict is scored on the INTERSECTION of the two
      # trackers, so a stale ensemble file silently freezes the comparison. Until 2026-07-28
      # only the calibrated tracker was rebuilt here and the ensemble one came from the MANUAL
      # retrain: it sat at targets <= 2026-07-26 while the calibrated tracker ran to 07-29, the
      # common set stuck at 246 markets, and the published Brier stopped moving for days while
      # looking perfectly healthy. Same failure mode as the stale training targets in CLAUDE.md.
      - name: Regenerate ensemble baseline tracker
        working-directory: src/polymarket_weather
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots --disable-calibrator

      # QRF is parked (M1 failed twice) but its tracker feeds the M1 GATE line; keep it current
      # so that line never reports a frozen verdict. Non-fatal: a missing/failed artifact must
      # not block the core tracker commit.
      - name: Regenerate QRF tracker
        working-directory: src/polymarket_weather
        continue-on-error: true
        run: python polymarket_weather_analysis.py --data_dir ./data --no_plots --predictor qrf

      # Permanent grading guard (CLAUDE.md): compares resolves_yes against how markets
      # ACTUALLY settled and exits 1 below 95% agreement. Runs after the truth refresh so a
      # regression in either truth source fails the run instead of silently republishing.
      - name: Settlement audit (grading fidelity floor)
        working-directory: src/polymarket_weather
        run: python audit_settlements.py

      - name: Gate progress
        working-directory: src/polymarket_weather
        run: python data_status.py

      # Grade the breadth structure book off Polymarket's OWN settlement (/markets/{id}) and
      # FREEZE the resolved outcomes into the CSV. Read-time consumers (the dashboard) grade
      # offline from these frozen values, so this daily lookup is the only place that hits the
      # settlement API — keeping it bounded as the book grows.
      - name: Grade breadth structure book
        working-directory: src/polymarket_weather
        # Non-fatal: a slow/failed settlement sweep must never block the core tracker commit + audit.
        run: python -c "import shoulder_book_breadth as b; b.grade_book(); b.report_breadth()" || echo "breadth grade skipped (network) — retries next run"

      - name: Commit regenerated trackers
        run: |
          git config user.name "raincheck-collector"
          git config user.email "actions@users.noreply.github.com"
          git add src/polymarket_weather/output
          # Refresh the committed settlement-truth fallback (resilience against IEM outages —
          # see .gitignore). Only re-commits when a successful refetch actually changed a file.
          git add src/polymarket_weather/data/weather/*_historical_actuals.csv
          if git diff --cached --quiet; then
            echo "No tracker changes — nothing to commit."
            exit 0
          fi
          git commit -m "eval: daily truth refresh + tracker $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Conflict-proof push. actions/checkout pins the job to master's head at TRIGGER
          # time, so after this run waits out the shared git-push lock (e.g. behind a
          # multi-hour retrain) the checked-out base is stale and origin/master has moved —
          # a plain `git pull --rebase` then hits a real CONTENT conflict on the regenerated
          # eval CSVs and dies (exit 128; this is the 2026-07-21 truth-eval failure).
          # These trackers are DETERMINISTIC full regenerations, so a line-merge is
          # meaningless: on a rejected push we rebase with `-X ours`, which DEFERS to a
          # concurrent regeneration — if a retrain just republished the trackers with newer
          # models, keep theirs (our commit then rebases to empty and drops, the push no-ops).
          # If nobody else touched the trackers, ours applies cleanly. Either way: no failure,
          # and the next cycle self-heals. --autostash guards a dirty tree; || abort clears a
          # half-finished rebase so the next attempt starts clean.
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing onto latest origin/master"
            git pull --rebase --autostash -X ours || git rebase --abort
          done
          git push

# Scheduled market + forecast snapshot collection — laptop-independent.
#
# Hourly: run main.py --collect-only (Polymarket snapshots + price history,
# deterministic/multi-model/ensemble forecasts) and commit the appended CSVs. Market
# snapshots are PERISHABLE — a price you didn't record is gone forever — which is why
# this runs in CI rather than depending on a laptop being awake (see scripts/README.md
# for the launchd agents, which remain as a local complement).
#
# ⚠️ DO NOT "fix" this by making the cron more frequent. Over-scheduling BACKFIRES here, and
# the hourly cron this replaced is what proved it.
#
# The old comment said the cron was deliberately 2x the cadence we wanted, on the theory that a
# slot which fails to fire is "covered by the next one". That theory was measured in July and
# was wrong by 2026-08-27, when GitHub began rate-limiting this repo's scheduled dispatch to
# roughly ONE RUN PER WORKFLOW PER 4-5 HOURS:
#
#     workflow    cron        before 08-27   after
#     collect     hourly        23/day       2-6/day
#     dashboard   every 2h      12/day       2-5/day
#     truth-eval  DAILY          1/day       1/day  (never missed)
#
# Two different cron frequencies collapsing to the SAME absolute delivery rate is the tell: cron
# frequency stopped mattering entirely. The daily job is untouched because 24h is longer than
# the throttle interval. The dropped runs are not delayed — they are never created at all (no
# `cancelled`, no `skipped`, no error; delivered runs still start within ~2 min of their slot).
#
# The mechanism: scheduled workflows share one global queue with every push and PR on the
# platform, with no reserved capacity, and a PENDING FIRE IS DISCARDED WHEN THE NEXT FIRE FOR
# THAT WORKFLOW COMES DUE. So a shorter interval gives each fire a shorter window to be
# dispatched before it is thrown away — a 1h cron under a 4h delay loses nearly everything,
# where a 3h cron loses much less. Frequency buys nothing and costs priority.
#
# Hence 3-hourly (8 fires/day, each with a 3h dispatch window) rather than hourly. This also cuts
# the repo's Actions footprint from ~5.75 h/day to ~2 h/day; the throttle engaged immediately
# after two days at ~490 runner-min/day (35-37 jobs), so consumption is the most plausible
# trigger and the one lever we control.
#
# ⚠️ THIS IS AN EXPERIMENT — measure it, do not assume it worked. Compare delivered runs/day
# (`gh api .../actions/workflows/collect.yml/runs` grouped by date) against the 2-6/day it was
# getting on the hourly cron. If delivery does NOT improve, the drop-on-next-fire model is wrong
# for this account and the honest move is to revert rather than keep lengthening the interval.
# If GitHub later lifts the throttle, revisit: 8 snapshots/day is a real reduction on the 23 the
# hourly cron once delivered, and sample accrual for the structure book is the whole point.
#
# Cost: ~15-20 min/run x 8 runs/day. The repo is PUBLIC so Actions minutes are nominally free,
# but "free" is not "unmetered" — the throttle is the bill.
#
# All data files are append-only and deduped on read, so re-runs and overlaps with the
# laptop collector are safe; the rebase-with-retry push handles concurrent commits.

name: collect

on:
  schedule:
    - cron: "13 */3 * * *"   # every 3h — a longer dispatch window beats a shorter interval (see above)
  workflow_dispatch: {}

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    # Raised 20 -> 45 on 2026-07-30, when tag-based discovery took the cycle from ~21 markets to
    # ~264. Each market costs a CLOB price-history fetch, so the first real run took 10m43s — 54%
    # of the old 20-minute budget where it used to be a small fraction. A killed collect does not
    # retry and the snapshots are PERISHABLE: a price not recorded at 14:00 is gone for good. The
    # headroom is deliberately generous because the failure is unrecoverable and the cost of an
    # idle runner minute is not.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/polymarket_weather/requirements.txt

      - name: Install dependencies
        run: pip install -r src/polymarket_weather/requirements.txt

      - name: Collect snapshot
        working-directory: src/polymarket_weather
        run: python main.py --collect-only

      # Minute-resolution prices for bins quoted on BOTH venues (megaplan 13f). The routine
      # collector samples each venue once an hour, so "which venue moved first" has no
      # observations at all — the question is unmeasurable rather than merely underpowered.
      # Scoped to near-dated matched bins and pruned to RETAIN_DAYS, so it accumulates at a
      # bounded ~6 MB/day rather than the ~2 GB/year an unscoped minute feed would cost.
      # Best-effort: this is an experiment and must never block the routine snapshot commit.
      - name: Cross-venue minute prices (experiment)
        working-directory: src/polymarket_weather
        continue-on-error: true
        run: python fetch_crossvenue_minute.py

      - name: Commit appended data
        run: |
          git config user.name "raincheck-collector"
          git config user.email "actions@users.noreply.github.com"
          # data/kalshi MUST be here: step_fetch_kalshi writes markets/books/candles to the
          # runner's disk, and an un-added path is destroyed with the runner. Kalshi serves
          # market objects for only ~2 months, so every uncommitted cycle is perishable data
          # lost permanently — and the run stays green while it happens. (Merged 2026-08-04
          # with this path missing; caught the same day, ~2 cycles of Kalshi prices lost.)
          git add src/polymarket_weather/data/polymarket src/polymarket_weather/data/weather src/polymarket_weather/data/kalshi src/polymarket_weather/data/crossvenue src/polymarket_weather/output/shoulder_paper.csv src/polymarket_weather/output/shoulder_paper_breadth.csv
          if git diff --cached --quiet; then
            echo "No new data rows — nothing to commit."
            exit 0
          fi
          git commit -m "data: scheduled snapshot $(date -u '+%Y-%m-%d %H:%M UTC')"
          # Conflict-proof push (same shape as truth-eval.yml / retrain.yml — this job was the
          # only committer WITHOUT it, and that gap cost a cycle of perishable data on
          # 2026-08-12, run 31586909186).
          #
          # What happened: truth-eval committed at 10:04 while this job was collecting, so the
          # 10:28 push was rejected. The bare `git pull --rebase` then hit a real CONTENT
          # conflict on output/shoulder_paper_breadth.csv — truth-eval's grade_book() FREEZES
          # settled_outcome into rows this job had appended, so both sides genuinely rewrite the
          # same lines. With no `-X` strategy the rebase stopped at the conflict, and with no
          # `|| git rebase --abort` the tree stayed mid-rebase on a detached HEAD: all three
          # retries and the final push then failed against the half-finished rebase. The run
          # went red and that hour's Polymarket + Kalshi snapshot was lost for good.
          #
          # `-X theirs` during a rebase KEEPS OUR COMMIT's side (the naming inverts under
          # rebase: "ours" is the upstream being replayed onto). That is the right way round
          # here, because the two losses are not symmetric:
          #   - our appended rows are PERISHABLE — an entry price only exists while the market
          #     sits in the band, and no job can reconstruct it later;
          #   - the grades we would drop are SELF-HEALING — grade_book re-looks-up any entry
          #     whose settled_outcome is still unset, so the next truth-eval refreezes them.
          # Keep the irreplaceable side and let the reproducible side rebuild itself.
          #
          # NOTE: this job deliberately stays OUT of the shared `git-push` concurrency group.
          # retrain holds that group for up to 6h, which would queue away ~6 hourly collections
          # (GitHub keeps only one pending run per group and cancels the rest) — far worse than
          # an occasional rebase. Serialise the cheap jobs; never block the perishable one.
          for i in 1 2 3; do
            git push && exit 0
            echo "push rejected (attempt $i) — rebasing onto latest origin/master"
            git pull --rebase --autostash -X theirs || git rebase --abort
          done
          git push

      # GitHub rejects any file over 100 MB at the PRE-RECEIVE HOOK, so the failure arrives as an
      # opaque "remote rejected" after the data has already been collected. On 2026-08-12
      # san_francisco_markets.csv crossed the line and every collect push failed for ten
      # consecutive runs — ~16 hours of perishable snapshots lost. GitHub had been printing
      # "larger than GitHub's recommended maximum" warnings on every push for days beforehand;
      # they scrolled past in a green log and nobody read them. This step converts that unread
      # warning into something with a threshold attached.
      #
      # It runs AFTER the commit, and `always()` so it also reports when the push itself failed.
      #
      # It used to run BEFORE it, and on 2026-09-02 that inverted its purpose: san_francisco
      # crossed 95 MiB, the guard exited 1, the commit step never ran, and FIVE consecutive
      # cycles of perishable Polymarket + Kalshi snapshots were discarded — the exact loss this
      # step exists to prevent. The threshold was also the wrong thing to fail on: GitHub rejects
      # at 100 MB, so at 95 MiB every one of those pushes would have gone through. ~6 days of
      # real headroom were traded for immediate, unrecoverable data loss.
      #
      # Ordering is the fix, not the threshold. With the data already pushed, failing here is a
      # pure alarm that costs nothing — and it should stay loud, since a warning in a green log
      # is exactly what went unread before 2026-08-12. `always()` preserves the original
      # diagnosis: when a file really is over 100 MB the pre-receive hook rejects the push and
      # the commit step fails, and this step is what names WHICH file.
      - name: Guard — data files approaching GitHub's 100 MB hard limit
        if: always()
        run: |
          find src/polymarket_weather/data -type f -size +75M -printf '%s\t%p\n' \
            | sort -rn > /tmp/bigfiles || true
          if [ ! -s /tmp/bigfiles ]; then
            echo "All tracked data files are under 75 MB."
            exit 0
          fi
          awk -F'\t' '{printf "  %6.1f MB  %s\n", $1/1048576, $2}' /tmp/bigfiles
          awk -F'\t' '$1 >  99614720 {print "::error::"   $2 " is over 95 MB — GitHub rejects at 100 MB"}
                      $1 <= 99614720 {print "::warning::" $2 " is over 75 MB — normalise it before it reaches 100 MB"}' /tmp/bigfiles
          over=$(awk -F'\t' '$1 > 99614720' /tmp/bigfiles | wc -l)
          if [ "$over" -gt 0 ]; then
            echo "$over file(s) within 5 MB of GitHub's 100 MB hard limit."
            echo "This cycle's data IS committed — the step above ran first. This run is red as"
            echo "an ALARM, with a few days of headroom left to act, not because anything failed."
            echo "See src/polymarket_weather/migrate_kalshi_meta.py for the fact/dimension split."
            exit 1
          fi

